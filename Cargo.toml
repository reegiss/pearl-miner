[workspace]
members = [
    "crates/pearl-types",
    "crates/pearl-commitment",
    "crates/pearl-noise",
    "crates/pearl-peel",
    "crates/pearl-block",
    "crates/pearl-gpu",
]
resolver = "2"

[package]
name = "pearl-miner"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "pearl-miner"
path = "src/main.rs"

[dependencies]
pearl-types      = { path = "crates/pearl-types" }
pearl-commitment = { path = "crates/pearl-commitment" }
pearl-noise      = { path = "crates/pearl-noise" }
pearl-peel       = { path = "crates/pearl-peel" }
pearl-block      = { path = "crates/pearl-block" }
pearl-gpu        = { path = "crates/pearl-gpu" }
tokio  = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
serde_json = "1"
anyhow = "1"
clap   = { version = "4", features = ["derive"] }
bech32 = "0.11"
