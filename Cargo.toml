[workspace]
members = [
    ".",
    "crates/pearl-types",
    "crates/pearl-commitment",
    "crates/pearl-noise",
    "crates/pearl-gpu",
]
resolver = "2"

[package]
name = "pearl-miner"
version = "0.1.0"
edition = "2021"

[dependencies]
clap        = { version = "4", features = ["derive"] }
tokio       = { version = "1", features = ["full"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
blake3      = "1"
pearl-types       = { path = "crates/pearl-types" }
pearl-commitment  = { path = "crates/pearl-commitment" }
pearl-noise       = { path = "crates/pearl-noise" }
pearl-gpu         = { path = "crates/pearl-gpu" }
